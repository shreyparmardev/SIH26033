name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (NestJS, Prisma, PostgreSQL & Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sih26033
          POSTGRES_PASSWORD: sih26033_ci_password
          POSTGRES_DB: sih26033_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sih26033 -d sih26033_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sih26033:sih26033_ci_password@localhost:5432/sih26033_ci_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      JWT_EXPIRATION: 7d
      AI_INTERNAL_KEY: ci-test-internal-key-16chars
      AI_SERVICE_URL: http://localhost:8080
      LOGISTICS_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Install
        run: npm ci

      - name: Validate Prisma Schema
        run: npm --workspace=apps/api run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Database Migrations (Isolated CI DB)
        run: npm run db:migrate:deploy

      - name: Backend Typecheck
        run: npm run type-check -w apps/api

      - name: Backend Lint
        run: npm run lint -w apps/api

      - name: Backend Unit Tests
        run: npm run test -w apps/api

      - name: Backend E2E Tests
        run: npm run test:e2e -w apps/api

      - name: Build Backend Production Bundle
        run: npm run build:api

  frontend:
    name: Frontend (Next.js, TypeScript & ESLint)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Install
        run: npm ci

      - name: Frontend Typecheck
        run: npm run type-check -w apps/web

      - name: Frontend Lint
        run: npm run lint -w apps/web

      - name: Build Frontend Production Bundle
        run: npm run build:web

  ai:
    name: AI Service (Python 3.12 & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preprocess Datasets & Build Splits
        run: |
          python -m pipelines.preprocessing
          python -m pipelines.build_splits

      - name: Verify Training Pipeline Artifacts
        run: python -m training.train_all

      - name: Run Pytest Suite
        run: python -m pytest tests/

  security:
    name: Security Audits & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Check for Uncommitted/Tracked Secrets
        run: |
          # Verify no real .env files are committed into git (only .env.example allowed)
          TRACKED_ENVS=$(git ls-files | grep -E "^\.env$" || true)
          if [ -n "$TRACKED_ENVS" ]; then
            echo "ERROR: Tracked .env file detected in repository: $TRACKED_ENVS"
            exit 1
          fi
          echo "Secret hygiene verified: No sensitive .env files tracked in Git."
